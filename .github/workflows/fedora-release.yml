name: Fedora build
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: fedora-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        run: python3 scripts/release-version.py
      - name: Build Fedora 44 image
        run: |
          if ! docker build -f packaging/fedora/Dockerfile -t ihtd-fedora-builder . > /tmp/fedora-image.log 2>&1; then
            python3 - <<'PY'
          from pathlib import Path
          detail = '\n'.join(Path('/tmp/fedora-image.log').read_text().splitlines()[-80:])
          detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Fedora image build failure::' + detail)
          PY
            tail -80 /tmp/fedora-image.log
            exit 1
          fi
          cat /tmp/fedora-image.log
      - name: Build, test and verify installed RPM
        run: |
          if ! docker run --name ihtd-fedora-package ihtd-fedora-builder bash -c 'bash packaging/fedora/build.sh && bash packaging/fedora/verify.sh' > /tmp/fedora-build.log 2>&1; then
            python3 - <<'PY'
          from pathlib import Path
          detail = '\n'.join(Path('/tmp/fedora-build.log').read_text().splitlines()[-80:])
          detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Fedora package build failure::' + detail)
          PY
            tail -80 /tmp/fedora-build.log
            exit 1
          fi
          cat /tmp/fedora-build.log
          mkdir -p dist
          docker cp ihtd-fedora-package:/workspace/dist/fedora dist/fedora
          (cd dist/fedora && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-package
          path: dist/fedora/
          if-no-files-found: error
          retention-days: 90
