name: Fedora release
on:
  push:
    branches: [codex/fedora-release-0.2.1]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fedora-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Fedora 44 image
        run: docker build -f packaging/fedora/Dockerfile -t ihtd-fedora-builder .
      - name: Build, test and verify installed RPM
        run: |
          docker run --name ihtd-fedora-package ihtd-fedora-builder bash -c 'bash packaging/fedora/build.sh && bash packaging/fedora/verify.sh'
          mkdir -p dist
          docker cp ihtd-fedora-package:/workspace/dist/fedora dist/fedora
          (cd dist/fedora && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: IHTD-0.2.1-fedora44-x86_64
          path: dist/fedora/
          if-no-files-found: error
          retention-days: 90
      - name: Upload draft prerelease
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v0.2.1-fedora
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" --title 'IHTD 0.2.1 Fedora test release' --notes 'Fedora 44 x86-64 RPM and portable bundle. Includes shared descendant moves. Review checksums and installation instructions before publication.' --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$tag" dist/fedora/*.rpm dist/fedora/*.tar.gz dist/fedora/SHA256SUMS dist/fedora/INSTALL.md --clobber --repo "$GITHUB_REPOSITORY"
