name: Windows build
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        run: python scripts/release-version.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default 1.93.1
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      - name: Test and build
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: ./scripts/install-inno-setup.ps1
      - name: Exercise desktop and phone layout
        working-directory: app
        shell: pwsh
        env:
          IHTD_INSTALLER_TEST_COLLECTION: ${{ runner.temp }}/ihtd-installer-fixture.ihtd
        run: |
          function Invoke-IhtdTest([string[]] $TestArguments, [string] $LogName) {
            & flutter @TestArguments 2>&1 | Tee-Object -FilePath $LogName
            $testExitCode = $LASTEXITCODE
            if ($testExitCode -ne 0) {
              $detail = (Get-Content $LogName -Tail 80) -join "`n"
              $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows test failure::$detail"
              throw "Flutter test failed: $LogName"
            }
          }
          Invoke-IhtdTest -TestArguments @('test', 'test') -LogName 'adapter-test.log'
          Invoke-IhtdTest -TestArguments @('test', 'integration_test/app_test.dart', '-d', 'windows') -LogName 'desktop-test.log'
          Invoke-IhtdTest -TestArguments @('test', 'integration_test/migration_test.dart', '-d', 'windows') -LogName 'migration-test.log'
          Invoke-IhtdTest -TestArguments @('test', 'integration_test/phone_layout_test.dart', '-d', 'windows') -LogName 'phone-test.log'
      - name: Verify release launch and package
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD 'app/build/windows/x64/runner/Release'
          $process = Start-Process (Join-Path $bundle 'ihtd.exe') -WorkingDirectory $bundle -PassThru
          try {
            Start-Sleep -Seconds 15
            if ($process.HasExited) { throw 'Release exited before smoke check completed' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }
          ./scripts/package-windows.ps1
      - name: Verify installer upgrade and uninstall
        shell: pwsh
        env:
          IHTD_INSTALLER_TEST_COLLECTION: ${{ runner.temp }}/ihtd-installer-fixture.ihtd
        run: ./scripts/verify-windows-installer.ps1
      - name: Retain failed installer test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-test-logs
          path: ${{ runner.temp }}/ihtd-installer-test-*/*.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/windows/*.zip
            dist/windows/*-setup.exe
            dist/windows/SHA256SUMS
            dist/windows/INSTALL.md
          if-no-files-found: error
          retention-days: 14
